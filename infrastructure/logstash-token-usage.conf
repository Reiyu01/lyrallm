# Logstash configuration for Semantic Kernel Token Usage
# Place this file in Logstash config directory

input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # 只處理 token usage 事件
  if [event_type] == "token_usage" {
    
    # 添加索引名稱
    mutate {
      add_field => { "[@metadata][index_name]" => "semantic-kernel-token-usage-%{+YYYY.MM.dd}" }
    }
    
    # 轉換數據類型
    mutate {
      convert => { 
        "prompt_tokens" => "integer"
        "completion_tokens" => "integer"
        "total_tokens" => "integer"
        "cost_usd" => "float"
      }
    }
    
    # 添加計算欄位
    ruby {
      code => "
        prompt_tokens = event.get('prompt_tokens') || 0
        completion_tokens = event.get('completion_tokens') || 0
        total_tokens = event.get('total_tokens') || 0
        
        if total_tokens > 0
          event.set('tokens_efficiency', (completion_tokens.to_f / total_tokens.to_f).round(3))
        end
        
        # 添加成本分級
        cost = event.get('cost_usd') || 0.0
        if cost < 0.01
          event.set('cost_level', 'low')
        elsif cost < 0.1
          event.set('cost_level', 'medium')
        else
          event.set('cost_level', 'high')
        end
      "
    }
  }
  
  # 添加地理位置信息（如果需要）
  geoip {
    source => "client_ip"
    target => "geoip"
  }
}

output {
  if [event_type] == "token_usage" {
    elasticsearch {
      hosts => ["localhost:9200"]
      index => "%{[@metadata][index_name]}"
      # 如果需要認證，取消註釋下面的行
      # user => "elastic"
      # password => "your_password"
    }
  }
  
  # 調試輸出（可選）
  stdout { 
    codec => rubydebug 
  }
}