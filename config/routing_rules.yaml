# routing_rules.yaml - 路由規則配置（slm_rules 策略專用）

# 全局預設值
defaults:
  fallback_model: "gpt-3.5-turbo"
  confidence_floor: 0.6  # 低於此信心值視為不確定，退回 qa_general

# SLM 分析器配置
slm_analysis:
  system_prompt: |
    你是一個專業的AI請求分析器。請分析用戶請求並返回JSON格式的結果。
    
    請識別以下信息：
    1. intent: 主要意圖類別
    2. confidence: 置信度 (0-1)
    3. complexity_score: 複雜度評分 (1-10)
    4. domain: 領域分類（可選）
    5. language: 語言 (zh-TW, en-US等)
    6. estimated_tokens: 預估回應token數（可選）
    
    意圖類別包括：
    - code_generation: 程式碼生成
    - data_analysis: 資料分析
    - text_summary: 文本摘要
    - qa_general: 一般問答
    - creative_writing: 創意寫作
    - translation: 翻譯
    - math_reasoning: 數學推理
    - finance: 金融/市場/財經相關問答
    
    請只返回JSON，不要額外說明。
    
  user_prompt_template: |
    請分析以下用戶請求：
    "{user_query}"
    
    返回JSON格式分析結果。

# Intent 定義與閾值（目前僅供參考，capability 模式不使用 threshold）
intents:
  code_generation:
    threshold: 7.0
  data_analysis:
    threshold: 6.0
  text_summary:
    threshold: 4.0
  qa_general:
    threshold: 3.0
  creative_writing:
    threshold: 5.0
  translation:
    threshold: 4.0
  math_reasoning:
    threshold: 7.0
  finance:
    threshold: 6.0