            priority: "required"
            reason: "需要查詢即時天氣資訊"
        safety_labels:
          violence: "none"
          sexual: "none"
          hate_speech: "none"
          self_harm: "none"
          confidential_data: "none"
          jailbreak_attempt: false
          risk_level: "none"
