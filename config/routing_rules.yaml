# Intent 定義與閾值（目前僅供參考，capability 模式不使用 threshold）
intents:
  code_generation:
    threshold: 7.0
  data_analysis:
    threshold: 6.0
  text_summary:
    threshold: 4.0
  qa_general:
    threshold: 3.0
  creative_writing:
    threshold: 5.0
  translation:
    threshold: 4.0
  math_reasoning:
    threshold: 7.0
  finance:
    threshold: 6.0