# Semantic Kernel 模型配置
server:
  host: "0.0.0.0"
  port: 8081
  debug: false

models:
  default_model: "gpt-4o"
  
  #10/13 <
  # 路由系統配置
  routing:
    enabled: true
    strategy: "slm_rules"  # hybrid | vector_only | rule_only | slm_only | slm_rules
    config_file: "routing_rules.yaml"
    
    # 🤝 階段1: Vector+SLM 聯合意圖分析
    intent_analysis:
      enabled: true
      mode: "parallel"  # parallel | progressive
      
      # Vector 分析器 (複用現有 SemanticRouter)
      vector:
        enabled: true
        provider: "elasticsearch"  # 使用現有實現
        similarity_threshold: 0.7
        top_k: 5
        weight: 0.3  # 降低權重，因為 O3-mini 更準確
        
      # SLM 分析器  
      small_model:
        enabled: true
        provider: "ollama"  # huggingface | ollama | azure_openai | openai
        model: "gpt-oss:20b"
        #deployment_name: "${AZURE_OPENAI_O3MINI_DEPLOYMENT_NAME}"
        # confidence_threshold: 0.8
        max_inference_time: 50000  # ms (120b 大模型需要更多時間，設為 60 秒(60000))
        # weight: 0.7  # 提高權重因為 O3-mini 更準確
        temperature: 0.1  # 低溫度確保一致性
        max_tokens: 150   # 限制回應長度
        
      # 融合策略配置
      fusion:
        consensus_bonus: 0.2      # 意圖一致時的置信度加成
        conflict_penalty: 0.1     # 意圖衝突時的置信度懲罰
        uncertainty_threshold: 0.5 # 不確定性閾值
        fast_path_threshold: 0.9   # Vector 快速通道閾值
        
    # 📋 階段2: 規則引擎決策
    rule_engine:
      enabled: true
      config_file: "routing_rules.yaml"
      
    # 最終決策權重 (意圖分析 → 規則決策)
    decision_flow:
      intent_confidence_weight: 0.7   # 意圖分析結果權重
      rule_match_weight: 0.3          # 規則匹配權重
  #10/13 >

  available_models:
    - name: "auto"
      provider: "auto"
      enabled: true
      description: "Automatic routing: backend chooses the best model based on intent (select 'auto' to let router decide)"
      # not a real provider; special virtual model for frontend convenience

    - name: "gpt-4o"
      provider: "azure_openai"
      endpoint: "${AZURE_OPENAI_ENDPOINT}"
      api_key: "${AZURE_OPENAI_API_KEY}"
      deployment_name: "${AZURE_OPENAI_GPT4O_DEPLOYMENT_NAME}"
      api_version: "${AZURE_OPENAI_API_VERSION}"
      enabled: true
      description: "Azure OpenAI GPT-4o via Semantic Kernel"
      max_completion_tokens: 4096
      # intents: list of intents this model should be considered for by the semantic router
      # set to an empty list to let intent_routing map intents -> models instead
      intents: ["open_qa"]
      iq_score: 25   # placeholder IQ score (will be mapped to percentile -> capability level)


    - name: "o3-mini"
      provider: "azure_openai"
      endpoint: "${AZURE_OPENAI_ENDPOINT}"
      api_key: "${AZURE_OPENAI_API_KEY}"
      deployment_name: "${AZURE_OPENAI_O3MINI_DEPLOYMENT_NAME}"
      api_version: "${AZURE_OPENAI_API_VERSION}"
      enabled: true
      description: "Azure OpenAI o3-mini via Semantic Kernel"
      #max_tokens: 4096
      max_completion_tokens: 4096
      intents: ["open_qa", "closed_qa","summarization"]
      # approximate capability baseline lower than gpt-4o
      iq_score: 48


    - name: "o1"
      provider: "azure_openai"
      endpoint: "${AZURE_OPENAI_ENDPOINT}"
      api_key: "${AZURE_OPENAI_API_KEY}"
      deployment_name: "o1"
      api_version: "${AZURE_OPENAI_API_VERSION}"
      enabled: true
      description: "Azure OpenAI o1"
      #max_tokens: 4096
      max_completion_tokens: 4096
      intents: ["summarization","text_generation"]
      iq_score: 47




    - name: "gpt-4o"
      provider: "openai"
      endpoint: "${OPENAI_API_BASE_URL}"
      api_key: "${OPENAI_API_KEY}"
      enabled: false
      description: "OpenAI GPT-4o via Semantic Kernel"
      max_tokens: 4096
      temperature: 0.7
      intents: ["general"]
      iq_score: 25


    - name: "gpt-oss:20b"
      provider: "ollama"
      endpoint: "${OLLAMA_BASE_URL}"
      enabled: true
      description: "Llama 2 via Ollama and Semantic Kernel"
      max_tokens: 2048
      temperature: 0.8
      intents: ["chatbot", "text_generation"]
      iq_score: 43



auth:
  default_role: "standard_user"

  roles:
    - name: "admin"
      description: "Full administrator; manages routing and policies."
      inherits: ["security_officer", "ops"]
      permissions:
        - "manage:roles"
        - "manage:routing"
        - "manage:policies"
        - "view:audit_logs"
        - "view:costs"
        - "configure:integrations"
      feature_flags:
        - "web_search"
        - "rag_search"
        - "image_generation"
        - "external_connectors"
      routing_policies:
        allow_external_providers: true
        audit_level: "full"

    - name: "security_officer"
      description: "Enforces safety policy and handles sensitive escalations."
      inherits: []
      permissions:
        - "enforce:safety_policies"
        - "view:audit_logs"
        - "approve:data_release"
      feature_flags:
        - "web_search"
      routing_policies:
        allow_external_providers: true
        escalate_on_sensitive: true
        audit_level: "high"

    - name: "ops"
      description: "Keeps routing reliable and cost efficient."
      inherits: []
      permissions:
        - "manage:failover"
        - "view:costs"
        - "view:routing_health"
      feature_flags:
        - "web_search"
        - "internal_tools"
      routing_policies:
        allow_external_providers: true
        preferred_fallback: "gpt-oss:20b"

    - name: "reviewer"
      description: "Reviews flagged conversations and resolves incidents."
      inherits: []
      permissions:
        - "view:audit_logs"
        - "resolve:incidents"
      feature_flags: []
      routing_policies:
        allow_external_providers: true
        audit_level: "review"

    - name: "power_user"
      description: "Trusted employee with advanced productivity features."
      inherits: ["standard_user"]
      permissions:
        - "use:web_search"
        - "use:rag_search"
        - "request:advanced_features"
      feature_flags:
        - "web_search"
        - "rag_search"
      routing_policies:
        allow_external_providers: true
        preferred_tiers:
          - "premium"
          - "trusted"
          
    - name: "standard_user"
      description: "Default employee profile."
      inherits: []
      permissions:
        - "chat:basic"
      feature_flags: []
      allowed_models:
        # - "gpt-4o"
        - "gpt-oss:20b"
      routing_policies:
        allow_external_providers: false
        preferred_tiers:
          - "trusted"
          - "internal_only"
        fallback: "gpt-oss:20b"
        sensitive_categories:
          - "S7"
        sensitive_fallback: "gpt-oss:20b"

providers:
  azure_openai:
    endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    api_version: "${AZURE_OPENAI_API_VERSION}"
    timeout: 60
  # Azure AI Foundry (範例設定)
  # Foundry 常用參數為 model_id (而非 deployment_name)
  azure_ai_foundry:
    endpoint: "${AZURE_AI_FOUNDRY_ENDPOINT}"
    api_key: "${AZURE_AI_FOUNDRY_API_KEY}"
    api_version: "${AZURE_AI_FOUNDRY_API_VERSION}"
    model_id: "${AZURE_AI_FOUNDRY_MODEL_ID}"
    timeout: 60
    
  openai:
    base_url: "${OPENAI_API_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    timeout: 60
    
  ollama:
    base_url: "${OLLAMA_BASE_URL}"
    timeout: 30

semantic_kernel:
  # Semantic Kernel 特定設定
  plugins_directory: "./plugins"
  memory_store: "sqlite"
  enable_planner: true
  enable_functions: true



# 事件匯流排配置（可切換 inproc / redis_stream / both）
event_bus:
  backend: inproc        # 可選: inproc | redis_stream | both
                               # - inproc: 使用 process 內的 asyncio.Queue（開發 / 單機）
                               # - redis_stream: 使用 Redis Streams (可靠、consumer group)
                               # - both: 同時 publish 到 inproc 與 redis_stream（方便平滑切換）
  redis_url: "127.0.0.1:6379"
  # redis_url: "${REDIS_URL}"    # Redis 連線字串，或直接填 "redis://localhost:6379/0"
  stream_name: "token_usage_stream"  # Redis stream 名稱（可選）
  group: "token_usage_group"          # consumer group 名稱（可選）
  # maxlen: 100000                   # optional: XADD MAXLEN 約略保留長度（code 尚未使用，可擴充）
  # dlq_stream: "token_usage_dlq"    # optional: 指定 DLQ stream（若未啟用會由 consumer 決定行為）


